# Render.com Blueprint – deploys the FastAPI backend as a Web Service.
# See https://render.com/docs/blueprint-spec for reference.

services:
  - type: web
    name: iisc-research-internshipp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
