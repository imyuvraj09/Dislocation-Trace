[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "tem-dislocation-pipeline"
version     = "1.0.0"
description = "Multi-stage pipeline for TEM dislocation analysis: colour-line detection, g-vector extraction, Up-vector solving, and character classification."
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.9"

authors = [
  { name = "TEM Pipeline Contributors" },
]

keywords = [
  "TEM", "dislocation", "crystallography",
  "electron-microscopy", "materials-science",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
tem-pipeline = "pipeline:main"

[project.urls]
Homepage   = "https://github.com/your-org/tem-dislocation-pipeline"
Issues     = "https://github.com/your-org/tem-dislocation-pipeline/issues"

[tool.hatch.build.targets.wheel]
packages = ["modules"]
